<!DOCTYPE html>
<html lang="en" data-palette="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Post Codeblocks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%2260%2025%20210%20210%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23C2603E%22%20stroke-width%3D%2211%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M70%2C90%20L200%2C90%20L200%2C220%20L70%2C220%20Z%22%2F%3E%3Cpath%20d%3D%22M70%2C90%20L130%2C40%20L260%2C40%20L200%2C90%22%2F%3E%3Cpath%20d%3D%22M260%2C40%20L260%2C170%20L200%2C220%22%2F%3E%3C%2Fg%3E%3Ctext%20x%3D%22135%22%20y%3D%22155%22%20font-family%3D%22monospace%22%20font-size%3D%22105%22%20font-weight%3D%22bold%22%20fill%3D%22%23C2603E%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%3EC%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
/* ===== Colour palettes — the ENTIRE colour scheme lives here. =====
   Swap the whole theme by setting  <html data-palette="orange|blue|green">.
   To add a palette, copy a block and change the values. Non-colour tokens
   (shadow) stay palette-independent in :root. Fixed status colours (shared
   green / hidden red) and the code syntax theme are defined separately and
   deliberately do NOT change with the palette. */
:root{ --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03); }
html[data-palette="orange"]{
  --bg:#FAF9F5; --bg-panel:#F4F3EE; --text:#1F1E1D; --text-muted:#7A7468;
  --border:#E5E2D9; --accent:#C2603E; --accent-hover:#A94E30;
  --code-bg:#F7F4EE; --code-text:#92402A; --code-border:rgba(146,64,42,0.28);
  --inline-code-bg:#EFEDE5; --inline-code-text:#92402A; --link:#B0512F;
}
html[data-palette="blue"]{
  --bg:#E1F1FB; --bg-panel:#CBE6F8; --text:#152430; --text-muted:#4C6375;
  --border:#ACD5F0; --accent:#2C82C4; --accent-hover:#2170AC;
  --code-bg:#D8ECFA; --code-text:#1C6BAE; --code-border:rgba(44,130,196,0.32);
  --inline-code-bg:#C6E2F6; --inline-code-text:#1C6BAE; --link:#2C82C4;
}
html[data-palette="green"]{
  --bg:#E4F2E8; --bg-panel:#D2E8D7; --text:#15211A; --text-muted:#4C6450;
  --border:#BBD9C1; --accent:#3F8F5B; --accent-hover:#337A4B;
  --code-bg:#DBEEDF; --code-text:#2E6B45; --code-border:rgba(63,143,91,0.32);
  --inline-code-bg:#CCE6D2; --inline-code-text:#2E6B45; --link:#3F8F5B;
}
*{box-sizing:border-box;}
html{margin:0;height:100%;}
/* Fixed viewport height (not min-height) so the page itself never scrolls —
   only the message list scrolls; the header and composer stay put. */
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

/* Header / brand bar */
header{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; padding:12px 24px;
  background:var(--bg); border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--text);min-width:0;flex:none;}
.brand .icon{height:1.85em;width:auto;color:var(--accent);flex:none;}
.brand #titleLabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw;}
.brand #titleLabel.renamable{cursor:pointer;}
.brand #titleLabel.renamable:hover{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;}
.code-pill{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;font-weight:700;letter-spacing:1px;
  background:var(--bg-panel);border:1px solid var(--border);
  padding:3px 10px;border-radius:6px;color:var(--code-text);
}
.actions{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end;}
/* Keeps the palette swatches tight against the actions (no space-between gap). */
.header-right{display:flex;align-items:center;gap:12px;flex:none;}

/* Page-width slider */
.width-control{display:flex;align-items:center;gap:8px;flex:1;max-width:280px;justify-content:center;}
.width-control .width-label{font-size:11px;color:var(--text-muted);white-space:nowrap;flex:none;}
#widthSlider{
  flex:1;-webkit-appearance:none;appearance:none;height:4px;min-width:60px;
  border-radius:999px;background:var(--border);outline:none;cursor:pointer;
}
#widthSlider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--code-border);
}
#widthSlider::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;
  border:2px solid var(--bg);box-shadow:0 0 0 1px var(--code-border);
}
@media (max-width:820px){ .width-control{display:none !important;} }

/* Palette picker swatches (between brand and slider) */
.palette-picker{display:flex;align-items:center;gap:7px;flex:none;}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--border);transition:transform .1s ease;}
.swatch:hover{transform:scale(1.12);}
.swatch.orange{background:#C2603E;}
.swatch.blue{background:#2C82C4;}
.swatch.green{background:#3F8F5B;}
.swatch.active{border-color:var(--text);}

/* Syntax highlighting theme (fixed — deliberately does NOT change with the palette) */
.hljs-comment,.hljs-quote{color:#6e7781;font-style:italic;}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type,.hljs-name{color:#cf222e;}
.hljs-string,.hljs-attr,.hljs-symbol,.hljs-bullet,.hljs-addition,.hljs-meta .hljs-string{color:#0a7d33;}
.hljs-number,.hljs-selector-attr,.hljs-selector-pseudo{color:#0550ae;}
.hljs-built_in,.hljs-title.class_,.hljs-class .hljs-title,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:#953800;}
.hljs-title,.hljs-title.function_,.hljs-function .hljs-title,.hljs-section{color:#6639ba;}
.hljs-tag{color:#116329;}
.hljs-meta{color:#6e7781;}
.hljs-deletion{color:#cf222e;}
.hljs-emphasis{font-style:italic;}
.hljs-strong{font-weight:600;}

/* Buttons */
button{font-family:inherit;cursor:pointer;}
.btn{
  background:var(--accent); color:#fff; border:none;
  padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600;
  transition:background .15s ease;
}
.btn:hover{background:var(--accent-hover);}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn.secondary:hover{background:var(--bg-panel);}
.btn:disabled{opacity:.5;cursor:default;}
/* "Allow copy" tick box — controls the students' whole-message Copy button. */
.allow-copy{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text);
  padding:7px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;user-select:none;}
.allow-copy:hover{background:var(--bg-panel);}
.allow-copy input{margin:0;accent-color:var(--accent);cursor:pointer;}
.allow-copy select{font-family:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--bg);
  border:1px solid var(--border);border-radius:6px;padding:1px 4px;cursor:pointer;}

/* Login form */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{
  width:100%;max-width:360px;background:var(--bg-panel);
  border:1px solid var(--border);border-radius:14px;padding:28px 26px;
  box-shadow:var(--shadow);
}
.login-card h1{font-size:18px;margin:0 0 4px;}
.login-card p{font-size:13px;color:var(--text-muted);margin:0 0 20px;}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin:0 0 5px;}
.login-card input{
  width:100%;padding:10px 12px;font-size:14px;font-family:inherit;
  border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);
  margin-bottom:14px;
}
.login-card input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.login-card .btn{width:100%;padding:10px;font-size:14px;}
.login-error{color:#B22;font-size:12.5px;margin:6px 0 0;min-height:16px;}

/* App layout */
#app{flex:1;display:none;min-height:0;}
#app.active{display:flex;}
.sidebar{
  width:var(--sidebar-w,230px);flex:none;
  background:var(--bg-panel);display:flex;flex-direction:column;min-height:0;
}
/* Draggable divider to resize the sidebar. */
.sidebar-resizer{
  flex:none;width:6px;cursor:col-resize;background:var(--border);
  transition:background .12s ease;
}
.sidebar-resizer:hover, .sidebar-resizer.dragging{background:var(--accent);}
.sidebar-head{padding:14px 16px 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);}
.session-list{flex:1;overflow-y:auto;padding:0 8px 12px;}
/* Row is a positioning context; the tools overlay the text on hover. */
.session-item{
  position:relative;width:100%;
  padding:6px 10px;border-radius:8px;margin-bottom:2px;border:1px solid transparent;
}
.session-item:hover{background:var(--bg);}
.session-item.active{background:var(--bg);border:1px solid var(--border);}
.session-main{
  display:block;width:100%;text-align:left;background:none;border:none;
  font-family:inherit;color:var(--text);cursor:pointer;padding:2px 0;
}
/* Row 1: session name. Row 2: code + last-message time. Both ellipsised so
   they never overflow — widen the sidebar to reveal the full name. */
.session-main .sn{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.session-main .dt{display:block;font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.session-main .sc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.5px;color:var(--code-text);}
/* Edit/delete overlay the row's right edge on hover (no reserved column). */
.session-tools{
  position:absolute;top:0;right:0;height:100%;
  display:flex;align-items:center;gap:2px;padding-left:26px;padding-right:6px;
  opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:2;
  background:linear-gradient(to right, transparent, var(--bg) 45%);
}
.session-item:hover .session-tools{opacity:1;pointer-events:auto;}
.tool-btn{
  display:flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;
  background:none;border:none;border-radius:6px;color:var(--text-muted);cursor:pointer;
}
.tool-btn:hover{background:var(--bg-panel);color:var(--text);}
.tool-btn.danger:hover{background:rgba(194,96,62,0.12);color:var(--accent);}
.tool-btn svg{width:15px;height:15px;}
.session-empty{padding:10px;font-size:12.5px;color:var(--text-muted);}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.main-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;padding:24px;text-align:center;}
/* Only the messages scroll; the composer below stays pinned and always visible. */
.stream{flex:1;min-height:0;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.composer{
  flex:none;border-top:1px solid var(--border);background:var(--bg);
  padding:12px 24px;display:flex;justify-content:center;
}
.composer-inner{
  width:100%;max-width:min(var(--content-width,760px),100%);
  display:flex;flex-direction:column;gap:8px;
}
/* The edit box spans the same width as the messages (and tracks the slider). */
.composer textarea{
  width:100%;resize:vertical;height:200px;min-height:80px;max-height:70vh;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:15px;line-height:1.55;padding:11px 13px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg-panel);color:var(--text);
}
.composer textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.composer-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;}
.composer .hint{font-size:11px;color:var(--text-muted);text-align:right;}
/* Post with a smaller "Code" (post as code block) button underneath. */
.post-stack{display:flex;flex-direction:column;align-items:stretch;gap:4px;flex:none;}
.btn.small{padding:3px 10px;font-size:11.5px;font-weight:600;border-radius:6px;}
.stream-hint{color:var(--text-muted);font-size:14px;padding:8px 2px;}

/* Themed modal (replaces native prompt/confirm) */
.modal-overlay{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(31,30,29,0.38);
}
.modal-overlay.open{display:flex;}
.modal-card{
  width:100%;max-width:380px;background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:14px;padding:22px 22px 18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.18);
}
.modal-card h2{font-size:16px;margin:0 0 6px;}
.modal-card p{font-size:13.5px;color:var(--text-muted);margin:0 0 16px;line-height:1.5;}
.modal-card input{
  width:100%;padding:10px 12px;font-size:14px;font-family:inherit;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-panel);color:var(--text);margin:0 0 16px;
}
.modal-card input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.modal-card textarea{
  width:100%;min-height:150px;max-height:50vh;resize:vertical;margin:0 0 16px;
  padding:10px 12px;font-size:14px;line-height:1.55;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  border:1px solid var(--border);border-radius:8px;background:var(--bg-panel);color:var(--text);
}
.modal-card textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}
.btn.danger{background:var(--accent);}
.btn.danger:hover{background:var(--accent-hover);}

/* Message typography */
.msg-content{line-height:1.65;font-size:15.5px;}
.msg-content h1,.msg-content h2,.msg-content h3,.msg-content h4,.msg-content h5,.msg-content h6{
  font-weight:600;line-height:1.3;margin:0.8em 0 0.4em;
}
.msg-content h1{font-size:1.5em;border-bottom:1px solid var(--border);padding-bottom:0.2em;}
.msg-content h2{font-size:1.3em;border-bottom:1px solid var(--border);padding-bottom:0.2em;}
.msg-content h3{font-size:1.1em;}
.msg-content > *:first-child{margin-top:0;}
.msg-content > *:last-child{margin-bottom:0;}
.msg-content p{margin:0.7em 0;}
.msg-content a{color:var(--link);text-decoration:underline;text-decoration-color:rgba(176,81,47,0.35);}
.msg-content a:hover{text-decoration-color:var(--link);}
.msg-content ul,.msg-content ol{margin:0.6em 0;padding-left:1.4em;}
.msg-content li{margin:0.25em 0;}
.msg-content blockquote{
  margin:0.8em 0;padding:0.2em 1em;border-left:3px solid var(--accent);
  color:var(--text-muted);background:var(--bg-panel);border-radius:0 6px 6px 0;
}
.msg-content hr{border:none;border-top:1px solid var(--border);margin:1.2em 0;}
.msg-content img{max-width:100%;border-radius:8px;}
.msg-content table{border-collapse:collapse;width:100%;margin:0.8em 0;font-size:0.92em;display:block;overflow-x:auto;}
.msg-content th,.msg-content td{border:1px solid var(--border);padding:8px 12px;text-align:left;}
.msg-content th{background:var(--bg-panel);font-weight:600;}
.msg-content code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  background:var(--inline-code-bg);color:var(--text);padding:0.15em 0.4em;
  border-radius:5px;font-size:0.88em;
}

/* Code block component */
.code-block{
  position:relative;margin:1em 0;border-radius:10px;
  border:1px solid var(--code-border);background:var(--code-bg);box-shadow:var(--shadow);
}
.copy-btn{
  position:absolute;top:10px;right:10px;
  opacity:0;visibility:hidden;transform:translateY(-4px);
  transition:opacity .15s ease, transform .15s ease, background .15s ease;
  background:var(--bg);border:1px solid var(--code-border);color:var(--code-text);
  font-size:12px;padding:5px 10px;border-radius:6px;display:flex;align-items:center;gap:6px;
  cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.1);z-index:5;
}
.code-block:hover .copy-btn, .copy-btn:focus-visible{
  opacity:1;visibility:visible;transform:translateY(0);
}
.copy-btn:hover{background:rgba(146,64,42,0.08);}
.copy-btn.copied{color:#3F7A39;border-color:rgba(63,122,57,0.4);}
.copy-btn svg{width:13px;height:13px;flex:none;}
.code-block pre{margin:0;padding:16px 18px;overflow-x:auto;}
.msg-content .code-block code{
  background:none;color:var(--text);padding:0;border-radius:0;
  font-size:0.86em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  line-height:1.55;white-space:pre;
}

/* Inline code copy component */
.inline-code-wrap{position:relative;display:inline-block;vertical-align:baseline;}
.inline-copy-btn{
  position:absolute;top:-6px;right:-6px;
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(0.92);
  transition:opacity .12s ease, transform .12s ease, background .12s ease;
  background:var(--bg);color:var(--inline-code-text);border:1px solid var(--code-border);
  border-radius:999px;padding:2px 7px 2px 5px;font-size:10.5px;font-weight:600;
  display:flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap;z-index:20;
  box-shadow:0 1px 4px rgba(0,0,0,0.12);
}
.inline-copy-btn svg{width:10px;height:10px;flex:none;}
.inline-code-wrap:hover .inline-copy-btn{opacity:1;visibility:visible;pointer-events:auto;transform:scale(1);}
.inline-copy-btn.copied{color:#3F7A39;border-color:rgba(63,122,57,0.4);}

/* Message card + whole-message copy button */
.msg-wrap{
  width:100%;max-width:min(var(--content-width,760px),100%);
  padding:12px 16px;border-radius:10px;
  background:#ffffff;border:1px solid var(--border);
}
/* Border encodes share state (teacher only): green = shared, red = hidden. */
.msg-wrap.shared{border-color:#3F7A39;}
.msg-wrap.hidden{border-color:#C0392B;}
.msg-footer{display:flex;align-items:center;gap:10px;margin-top:4px;min-height:24px;}
.msg-copy-btn{
  opacity:0;visibility:hidden;transform:translateY(-2px);
  transition:opacity .15s ease, transform .15s ease, background .15s ease;
  background:var(--bg);border:1px solid var(--code-border);color:var(--code-text);
  font-size:12px;padding:4px 9px;border-radius:6px;display:flex;align-items:center;gap:6px;
  cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.1);order:2;
}
.msg-wrap:hover .msg-copy-btn, .msg-copy-btn:focus-visible{
  opacity:1;visibility:visible;transform:translateY(0);
}
.msg-copy-btn:hover{background:rgba(146,64,42,0.08);}
.msg-copy-btn.copied{color:#3F7A39;border-color:rgba(63,122,57,0.4);}
.msg-copy-btn svg{width:12px;height:12px;flex:none;}
.msg-time{font-size:11px;color:var(--text-muted);order:1;}
/* Teacher-only per-message edit + delete, styled like the copy button */
.msg-edit-btn,.msg-del-btn{
  opacity:0;visibility:hidden;transform:translateY(-2px);
  transition:opacity .15s ease, transform .15s ease, background .15s ease;
  background:var(--bg);border:1px solid var(--code-border);color:var(--code-text);
  font-size:12px;padding:4px 9px;border-radius:6px;display:flex;align-items:center;gap:6px;
  cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.1);
}
.msg-share-btn{
  opacity:0;visibility:hidden;transform:translateY(-2px);
  transition:opacity .15s ease, transform .15s ease, background .15s ease;
  background:var(--bg);border:1px solid var(--code-border);color:var(--code-text);
  font-size:12px;padding:4px 9px;border-radius:6px;display:flex;align-items:center;gap:6px;
  cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.1);
}
.msg-edit-btn{order:3;}
.msg-del-btn{order:4;}
.msg-share-btn{order:5;}
.msg-wrap:hover .msg-edit-btn, .msg-edit-btn:focus-visible,
.msg-wrap:hover .msg-del-btn, .msg-del-btn:focus-visible,
.msg-wrap:hover .msg-share-btn, .msg-share-btn:focus-visible{
  opacity:1;visibility:visible;transform:translateY(0);
}
.msg-edit-btn:hover{background:rgba(146,64,42,0.08);}

/* ============================================================
   Markdown rendering engine (verbatim, shared with student page)
   ============================================================ */
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function splitTableRow(line){
  let l = line.trim();
  if(l.startsWith("|")) l = l.slice(1);
  if(l.endsWith("|")) l = l.slice(0,-1);
  return l.split(/(?<!\\)\|/).map(c => c.replace(/\\\|/g,"|"));
}

// Blocks dangerous URL schemes (javascript:, data:, vbscript:) in links/images.
function sanitizeUrl(url){
  let stripped = "";
  for(let k = 0; k < url.length; k++){
    const code = url.charCodeAt(k);
    if(code > 32) stripped += url[k];
  }
  if(/^(javascript|data|vbscript):/i.test(stripped)) return "#";
  return url;
}

function inline(text){
  const codes = [];
  text = text.replace(/`([^`]+)`/g, function(m, c){
    codes.push(escapeHtml(c));
    return "@@IC" + (codes.length-1) + "@@";
  });
  text = escapeHtml(text);
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, function(m, alt, src, title){
    return '<img alt="' + alt + '" src="' + sanitizeUrl(src) + '"' + (title ? ' title="' + title + '"' : '') + '>';
  });
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, function(m, label, href, title){
    return '<a href="' + sanitizeUrl(href) + '"' + (title ? ' title="' + title + '"' : '') + ' target="_blank" rel="noopener noreferrer">' + label + '</a>';
  });
  text = text.replace(/&lt;((https?:\/\/|mailto:)[^&\s]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  text = text.replace(/(?<![A-Za-z0-9_])_([^_\n]+)_(?![A-Za-z0-9_])/g, "<em>$1</em>");
  text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  // Preserve every newline as a hard line break (chat-style): a plain-text
  // message typed across multiple lines keeps those line breaks. Trailing
  // spaces before a newline are normalised away first.
  text = text.replace(/ +\n/g, "\n");
  text = text.replace(/\n/g, "<br>\n");
  text = text.replace(/@@IC(\d+)@@/g, function(m, idx){
    return '<span class="inline-code-wrap"><code>' + codes[+idx] + '</code>' +
      '<button class="inline-copy-btn" type="button" data-label="Copy" aria-label="Copy code">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
      '<span class="copy-label">Copy</span></button></span>';
  });
  return text;
}

function parseListBlock(blockLines){
  const itemRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const root = { indent:-1, children:[] };
  const stack = [root];
  for(const raw of blockLines){
    const m = raw.match(itemRe);
    if(!m){
      const top = stack[stack.length-1];
      if(top !== root && /\S/.test(raw)) top.content += " " + raw.trim();
      continue;
    }
    const indent = m[1].length;
    const ordered = /\d/.test(m[2]);
    const content = m[3];
    const node = { indent, ordered, content, children:[] };
    while(stack.length > 1 && indent <= stack[stack.length-1].indent) stack.pop();
    stack[stack.length-1].children.push(node);
    stack.push(node);
  }
  function render(node){
    if(!node.children.length) return "";
    const ordered = node.children[0].ordered;
    const tag = ordered ? "ol" : "ul";
    let out = "<" + tag + ">";
    for(const c of node.children){
      out += "<li>" + inline(c.content) + render(c) + "</li>";
    }
    out += "</" + tag + ">";
    return out;
  }
  return render(root);
}

function isListBreaker(line){
  return /^(#{1,6})\s+/.test(line) ||
    /^ {0,3}([-*_])(\s*\1){2,}\s*$/.test(line) ||
    /^ {0,3}>\s?/.test(line) ||
    /^@@CB\d+@@$/.test(line);
}

function renderMarkdown(src){
  src = src.replace(/\r\n?/g, "\n");
  const codeBlocks = [];
  src = src.replace(/^```([^\n`]*)\n([\s\S]*?)\n```[ \t]*$/gm, function(m, lang, code){
    const idx = codeBlocks.length;
    codeBlocks.push({ lang: lang.trim(), code: code });
    return "@@CB" + idx + "@@";
  });
  const lines = src.split("\n");
  let html = "";
  let i = 0;
  let para = [];
  function flushPara(){
    if(para.length){ html += "<p>" + inline(para.join("\n")) + "</p>\n"; para = []; }
  }
  while(i < lines.length){
    const line = lines[i];
    if(/^\s*$/.test(line)){ flushPara(); i++; continue; }
    const cb = line.match(/^@@CB(\d+)@@$/);
    if(cb){
      flushPara();
      const block = codeBlocks[+cb[1]];
      const lang = block.lang;
      const langClass = lang ? ' class="language-' + escapeHtml(lang) + '"' : "";
      html += '<div class="code-block">' +
        '<button class="copy-btn" type="button" data-label="Copy">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
        '<span class="copy-label">Copy</span></button>' +
        '<pre><code' + langClass + '>' + escapeHtml(block.code) + '</code></pre></div>\n';
      i++; continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(h){ flushPara(); const level = h[1].length; html += "<h" + level + ">" + inline(h[2]) + "</h" + level + ">\n"; i++; continue; }
    if(/^ {0,3}([-*_])(\s*\1){2,}\s*$/.test(line)){ flushPara(); html += "<hr>\n"; i++; continue; }
    if(/^ {0,3}>\s?/.test(line)){
      flushPara();
      const bq = [];
      while(i < lines.length && /^ {0,3}>\s?/.test(lines[i])){ bq.push(lines[i].replace(/^ {0,3}>\s?/, "")); i++; }
      html += "<blockquote>" + renderMarkdown(bq.join("\n")) + "</blockquote>\n";
      continue;
    }
    if(/^\s*\|?.+\|.*$/.test(line) && lines[i+1] && /^\s*\|?[\s:|-]+\|?[\s:|-]*$/.test(lines[i+1]) && /-/.test(lines[i+1])){
      flushPara();
      const headerCells = splitTableRow(line);
      const alignRow = splitTableRow(lines[i+1]);
      const aligns = alignRow.map(function(c){
        const t = c.trim();
        if(/^:-+:$/.test(t)) return "center";
        if(/^-+:$/.test(t)) return "right";
        if(/^:-+$/.test(t)) return "left";
        return "";
      });
      i += 2;
      const rows = [];
      while(i < lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])){ rows.push(splitTableRow(lines[i])); i++; }
      html += "<table><thead><tr>" + headerCells.map(function(c, idx){
        const a = aligns[idx];
        return "<th" + (a ? ' style="text-align:' + a + '"' : "") + ">" + inline(c.trim()) + "</th>";
      }).join("") + "</tr></thead>";
      if(rows.length){
        html += "<tbody>" + rows.map(function(r){
          return "<tr>" + r.map(function(c, idx){
            const a = aligns[idx];
            return "<td" + (a ? ' style="text-align:' + a + '"' : "") + ">" + inline((c||"").trim()) + "</td>";
          }).join("") + "</tr>";
        }).join("") + "</tbody>";
      }
      html += "</table>\n";
      continue;
    }
    if(/^\s*([-*+]|\d+[.)])\s+/.test(line)){
      flushPara();
      const block = [];
      let topOrdered = null;
      while(i < lines.length){
        const cur = lines[i];
        if(/^\s*$/.test(cur)) break;
        const m = cur.match(/^(\s*)([-*+]|\d+[.)])\s+/);
        if(m){
          const indent = m[1].length;
          const ordered = /\d/.test(m[2]);
          if(indent === 0){
            if(topOrdered === null) topOrdered = ordered;
            else if(ordered !== topOrdered) break;
          }
          block.push(cur); i++;
        } else if(block.length && !isListBreaker(cur)){ block.push(cur); i++; }
        else break;
      }
      html += parseListBlock(block) + "\n";
      continue;
    }
    if(para.length === 0 && lines[i+1] !== undefined && /^ {0,3}(=+|-+)\s*$/.test(lines[i+1])){
      const level = lines[i+1].trim()[0] === "=" ? 1 : 2;
      html += "<h" + level + ">" + inline(line.trim()) + "</h" + level + ">\n";
      i += 2; continue;
    }
    para.push(line); i++;
  }
  flushPara();
  return html;
}

/* ============================================================
   Copy-to-clipboard (verbatim, shared with student page)
   ============================================================ */
const CHECK_SVG = '<polyline points="20 6 9 17 4 12"></polyline>';

function copyText(text, btn){
  function done(){
    const label = btn.querySelector(".copy-label");
    const svg = btn.querySelector("svg");
    const prevSvg = svg ? svg.innerHTML : null;
    btn.classList.add("copied");
    if(label) label.textContent = "Copied!";
    if(svg) svg.innerHTML = CHECK_SVG;
    setTimeout(function(){
      btn.classList.remove("copied");
      if(label) label.textContent = "Copy";
      if(svg && prevSvg !== null) svg.innerHTML = prevSvg;
    }, 1200);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  done();
}

/* ============================================================
   Shared rendering: append a message + copy delegation
   ============================================================ */
const messageStore = new Map(); // msgId -> raw text

function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function fmtTime(ts){
  const d = ts ? new Date(ts) : new Date();
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}

// Run highlight.js over any fenced code blocks (that declared a language)
// inside a message wrap. No-op if the CDN script hasn't loaded.
// Session default language for fenced blocks that don't name one (hljs name;
// "" = none). Applied at render time only — stored Markdown is never changed.
const DEFAULT_LANGS = ["java", "python", "javascript", "sql"];
let defaultLang = "";
function normalizeLang(v){ return DEFAULT_LANGS.indexOf(v) >= 0 ? v : ""; }

function highlightWrap(el){
  if(!window.hljs || !el) return;
  // Tag bare ``` blocks with the session default so highlight.js treats them
  // exactly like ```java (etc.). Explicit languages already have a class.
  if(defaultLang && window.hljs.getLanguage && window.hljs.getLanguage(defaultLang)){
    const bare = el.querySelectorAll('.code-block code:not([class*="language-"])');
    for(let i = 0; i < bare.length; i++) bare[i].classList.add("language-" + defaultLang);
  }
  const nodes = el.querySelectorAll('.code-block code[class*="language-"]');
  for(let i = 0; i < nodes.length; i++){ try { window.hljs.highlightElement(nodes[i]); } catch(e){} }
}

function appendMessage(container, id, rawText, ts){
  messageStore.set(id, rawText);
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap";
  wrap.dataset.msgId = id;
  wrap.innerHTML =
    '<div class="msg-content">' + renderMarkdown(rawText) + '</div>' +
    '<div class="msg-footer">' +
      '<button class="msg-copy-btn" type="button" data-label="Copy" aria-label="Copy message">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
        '<rect x="9" y="9" width="12" height="12" rx="2"></rect>' +
        '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
        '<span class="copy-label">Copy</span>' +
      '</button>' +
      '<time class="msg-time">' + fmtTime(ts) + '</time>' +
    '</div>';
  container.appendChild(wrap);
  highlightWrap(wrap);
  return wrap;
}

// Re-render an existing message in place after its text is edited.
function updateMessage(container, id, rawText){
  const wrap = container.querySelector('[data-msg-id="' + id + '"]');
  if(!wrap) return;
  messageStore.set(id, rawText);
  const contentEl = wrap.querySelector(".msg-content");
  if(contentEl){ contentEl.innerHTML = renderMarkdown(rawText); highlightWrap(wrap); }
}

// Remove a message that was deleted.
function removeMessage(container, id){
  const wrap = container.querySelector('[data-msg-id="' + id + '"]');
  if(wrap) wrap.remove();
  messageStore.delete(id);
}

// Re-render every message currently in the DOM from its raw text (used when
// the default language changes — highlighting can't be undone in place).
function rerenderAll(container){
  const wraps = container.querySelectorAll(".msg-wrap");
  for(let i = 0; i < wraps.length; i++){
    const id = wraps[i].dataset.msgId;
    const raw = messageStore.get(id);
    if(raw !== undefined) updateMessage(container, id, raw);
  }
}

function wireCopyDelegation(container){
  container.addEventListener("click", function(e){
    const btn = e.target.closest(".copy-btn, .inline-copy-btn, .msg-copy-btn");
    if(!btn) return;
    if(btn.classList.contains("copy-btn")){
      const codeEl = btn.closest(".code-block").querySelector("code");
      if(codeEl) copyText(codeEl.textContent, btn);
    } else if(btn.classList.contains("inline-copy-btn")){
      const codeEl = btn.previousElementSibling;
      if(codeEl) copyText(codeEl.textContent, btn);
    } else if(btn.classList.contains("msg-copy-btn")){
      const wrap = btn.closest(".msg-wrap");
      const raw = messageStore.get(wrap.dataset.msgId);
      if(raw !== undefined) copyText(raw, btn);
    }
  });
}

    modalTextarea.style.display = "none";
  } else {
    modalInput.style.display = "none";
    modalTextarea.style.display = "none";
  }
  modalOk.textContent = opts.okLabel || "OK";
  modalOk.classList.toggle("danger", !!opts.danger);
  modalOnOk = opts.onOk || null;
  modalOverlay.classList.add("open");
  setTimeout(function(){ (opts.textarea ? modalTextarea : (opts.input ? modalInput : modalOk)).focus(); }, 30);
}
function confirmModal(){
  // Textarea keeps exact formatting (no trim); single-line input is trimmed.
  let val = "";
  if(modalTextarea.style.display !== "none") val = modalTextarea.value;
  else if(modalInput.style.display !== "none") val = modalInput.value.trim();
  const cb = modalOnOk;
  closeModal();
  if(cb) cb(val);
}
modalOk.addEventListener("click", confirmModal);
modalCancel.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", function(e){ if(e.target === modalOverlay) closeModal(); });
modalInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); confirmModal(); } });
// In the textarea, Ctrl/Cmd+Enter confirms (plain Enter inserts a newline).
modalTextarea.addEventListener("keydown", function(e){
  if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); confirmModal(); }
  else if(isCodeShortcut(e)){ e.preventDefault(); toggleCodeInTextarea(modalTextarea); }
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && modalOverlay.classList.contains("open")) closeModal(); });

// Rename any session by id (used by the heading and the sidebar pencil).
function renameSession(id){
  const current = (sessionMeta[id] && sessionMeta[id].name) || "";
  openModal({
    title: "Rename session",
    input: true, inputValue: current, placeholder: "Session name (optional)",
    okLabel: "Save",
    onOk: function(name){
      db.ref("sessions/" + id + "/meta/name").set(name || null)
        .then(function(){
          sessionMeta[id] = sessionMeta[id] || {};
          sessionMeta[id].name = name;
          if(id === activeSession) updateHeading();
        })
        .catch(function(err){ alert("Rename failed: " + (err && err.message)); });
    }
  });
}

// Delete a session (with confirmation).
function deleteSession(id){
  const label = (sessionMeta[id] && sessionMeta[id].name) || id;
  openModal({
    title: "Delete session",
    message: 'Do you really want to delete this session' + (label ? ' “' + label + '”' : '') + '? This removes all of its messages and cannot be undone.',
    okLabel: "Delete", danger: true,
    onOk: function(){
      // Clear both child nodes in one atomic update. (Removing the whole
      // /sessions/{id} node directly would be denied — the rules only grant
      // write at .../meta and .../messages, not at the {id} level. With both
      // children gone the empty {id} node ceases to exist.)
      db.ref("sessions/" + id).update({ meta: null, messages: null })
        .then(function(){
          if(id === activeSession){
            detachMessages();
            activeSession = null;
            messageStore.clear();
            stream.innerHTML = "";
            stream.style.display = "none";
            composer.style.display = "none";
            sessionActions.style.display = "none";
            mainEmpty.style.display = "flex";
            updateHeading();
          }
        })
        .catch(function(err){ alert("Delete failed: " + (err && err.message)); });
    }
  });
}

/* ============================================================
   Create a brand-new session from a list of messages (used by Duplicate and
   Import JSON). Gets a NEW code, keeps each message's original ts + shared,
   and its fresh createdAt puts it at the top of the sidebar.
   `messages` = [{ text, ts, shared }] in chronological order.
   `allowCopy` / `lang` carry over the source session's "Allow copy" and default code language.
   ============================================================ */
function createSessionFromData(name, messages, allowCopy, lang){
  const id = generateSessionCode();
  const baseRef = db.ref("sessions/" + id + "/messages");
  const msgObj = {};
  (messages || []).forEach(function(m){
    if(!m) return;
    const key = baseRef.push().key; // sequential push keys preserve order
    const rec = { text: (m.text != null ? m.text : ""), shared: (m.shared !== false) };
    rec.ts = (typeof m.ts === "number" && m.ts > 0) ? m.ts : firebase.database.ServerValue.TIMESTAMP;
    msgObj[key] = rec;
  });
  const meta = { createdAt: firebase.database.ServerValue.TIMESTAMP };
  if(name) meta.name = name;
  if(allowCopy === true) meta.allowCopy = true; // only written when ticked (missing = false)
  lang = normalizeLang(lang);
  if(lang) meta.defaultLang = lang;             // only written when set (missing = none)
  const payload = { meta: meta };
  if(Object.keys(msgObj).length) payload.messages = msgObj;
  sessionMeta[id] = { name: name || "", createdAt: Date.now(), allowCopy: allowCopy === true, defaultLang: lang };
  // Write meta + messages as one atomic child update (see Section 5.1 — a write
  // at the {id} level itself would be denied).
  return db.ref("sessions/" + id).update(payload).then(function(){ openSession(id); return id; });
}

// Duplicate an existing session (with all its messages) under a new code/name.
function duplicateSession(srcId){
  db.ref("sessions/" + srcId).once("value").then(function(snap){
    const val = snap.val() || {};
    const meta = val.meta || {};
    const msgsObj = val.messages || {};
    const messages = Object.keys(msgsObj).sort().map(function(k){
      const m = msgsObj[k] || {};
      return { text: m.text, ts: m.ts, shared: m.shared };
    });
    openModal({
      title: "Duplicate session",
      input: true, inputValue: meta.name || "", placeholder: "Session name",
      okLabel: "Duplicate",
      onOk: function(name){
        createSessionFromData(name, messages, meta.allowCopy === true, meta.defaultLang).catch(function(err){ alert("Duplicate failed: " + (err && err.message)); });
      }
    });
  }).catch(function(err){ alert("Could not read session: " + (err && err.message)); });
}

// Import a previously-exported JSON session file as a new session.
const importInput = document.getElementById("importInput");
document.getElementById("importJsonBtn").addEventListener("click", function(){ importInput.value = ""; importInput.click(); });
importInput.addEventListener("change", function(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    let data;
    try { data = JSON.parse(ev.target.result); }
    catch(err){ alert("That file isn't valid JSON."); return; }
    if(!data || !Array.isArray(data.messages)){
      alert("This doesn't look like an exported Codeblocks session (no \"messages\" array).");
      return;
    }
    openModal({
      title: "Import session",
      input: true, inputValue: (data.name || ""), placeholder: "Session name",
      okLabel: "Import",
      onOk: function(name){
        createSessionFromData(name, data.messages, data.allowCopy === true, data.defaultLang).catch(function(err){ alert("Import failed: " + (err && err.message)); });
      }
    });
  };
  reader.readAsText(file);
});

/* --- Sessions sidebar --- */
function loadSessions(){
  db.ref("sessions").on("value", function(snap){
    const val = snap.val() || {};
    const items = Object.keys(val).map(function(id){
      const meta = (val[id] && val[id].meta) || {};
      const msgs = (val[id] && val[id].messages) || null;
      let lastTs = 0;
      if(msgs){ for(const k in msgs){ const t = msgs[k] && msgs[k].ts; if(t && t > lastTs) lastTs = t; } }
      sessionMeta[id] = { name: meta.name || "", createdAt: meta.createdAt || 0, allowCopy: meta.allowCopy === true, defaultLang: normalizeLang(meta.defaultLang) };
      return { id: id, name: meta.name || "", createdAt: meta.createdAt || 0, lastTs: lastTs };
    });
    items.sort(function(a, b){ return b.createdAt - a.createdAt; });
    renderSessionList(items);
    updateHeading(); // reflect a rename into the active heading live
    syncAllowCopy(); // reflect an allow-copy change (e.g. from another tab)
    syncLang();
  });
}

    if(messagesHandler) messagesRef.off("child_added", messagesHandler);
    if(changedHandler) messagesRef.off("child_changed", changedHandler);
    if(removedHandler) messagesRef.off("child_removed", removedHandler);
  }
  messagesRef = null; messagesHandler = null; changedHandler = null; removedHandler = null;
}

function openSession(id){
  detachMessages();
  activeSession = id;
  messageStore.clear();
  stream.innerHTML = "";
  updateHeading();
  syncAllowCopy();

  mainEmpty.style.display = "none";
  stream.style.display = "flex";
  composer.style.display = "flex";
  // refresh active highlight
  Array.prototype.forEach.call(sessionListEl.children, function(el){
    el.classList.toggle("active", el.dataset && el.dataset.sessionId === id);
  });
  messagesRef = db.ref("sessions/" + id + "/messages").orderByKey();
  messagesHandler = messagesRef.on("child_added", function(snap){
    const v = snap.val() || {};
    const wrap = appendMessage(stream, snap.key, v.text != null ? v.text : "", v.ts);
    addMsgControls(wrap);
    applyShared(wrap, v.shared);
    stream.scrollTop = stream.scrollHeight;
  });
  // Live-update / remove messages the teacher (or their other tab) edits, shares, deletes.
  changedHandler = messagesRef.on("child_changed", function(snap){
    const v = snap.val() || {};
    updateMessage(stream, snap.key, v.text != null ? v.text : "");
    const wrap = stream.querySelector('[data-msg-id="' + snap.key + '"]');
    applyShared(wrap, v.shared);
  });
  removedHandler = messagesRef.on("child_removed", function(snap){
    removeMessage(stream, snap.key);
  });
  composerInput.focus();
}

/* ============================================================
   Export the active session (one-time read of its full node).
   JSON = the raw data (Firebase is JSON underneath). Markdown = a
   chat-style transcript that renders cleanly in any Markdown viewer.
   ============================================================ */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function buildMarkdown(code, name, createdAt, msgs){
  const title = name ? name : ("Session " + code);
  let out = "# " + title + "\n\n";
  out += "**Session code:** `" + code + "`";
  if(createdAt) out += "  ·  started " + new Date(createdAt).toLocaleString();
  out += "  ·  exported " + new Date().toLocaleString() + "\n\n";
  if(!msgs.length) return out + "_No messages yet._\n";
  // Each message is separated by a horizontal rule and led by a bold
  // timestamp, so it reads like a chat log. The raw message text is emitted
  // verbatim on its own lines (blank line before it) — this is important
  // because a message may itself be Markdown (a heading, a fenced code
  // block, a list, …); keeping it at the left margin, unwrapped and
  // unindented, lets its own Markdown render correctly. Blank lines around
  // every `---` prevent a preceding text line from being misread as a
  // Setext heading.
  const blocks = msgs.map(function(m){
    const t = m.ts ? new Date(m.ts).toLocaleString() : "";
    const tag = (m.shared === false) ? " _(hidden from students)_" : "";
    return "**" + t + "**" + tag + "\n\n" + m.text;
  });
  out += "---\n\n" + blocks.join("\n\n---\n\n") + "\n\n---\n";
  return out;
}

function exportSession(format){
  if(!activeSession) return;
  const id = activeSession;
  db.ref("sessions/" + id).once("value").then(function(snap){
    const val = snap.val() || {};
    const meta = val.meta || {};
    const msgsObj = val.messages || {};
    const msgs = Object.keys(msgsObj).sort().map(function(k){
      const m = msgsObj[k] || {};
      return { id: k, ts: m.ts || 0, text: m.text != null ? m.text : "", shared: m.shared !== false };
    });
    const name = meta.name || "";
    if(format === "json"){
      const data = { session: id, name: name, createdAt: meta.createdAt || null,
        allowCopy: meta.allowCopy === true, defaultLang: normalizeLang(meta.defaultLang) || null, exportedAt: Date.now(), messages: msgs };
      downloadFile("codeblocks-" + id + ".json", JSON.stringify(data, null, 2), "application/json");
    } else {
      downloadFile("codeblocks-" + id + ".md", buildMarkdown(id, name, meta.createdAt, msgs), "text/markdown;charset=utf-8");
    }
  }).catch(function(err){ alert("Export failed: " + (err && err.message)); });
}
document.getElementById("exportJsonBtn").addEventListener("click", function(){ exportSession("json"); });
document.getElementById("exportMdBtn").addEventListener("click", function(){ exportSession("md"); });

/* --- Post --- */
// Wrap a whole message in a ``` block for "post as code". Leading blank lines
// and trailing whitespace are dropped (first-line indentation is kept). If the
// text already contains a ``` fence line it is posted unchanged, because the
// renderer doesn't support nested fences.
function wrapAsCodeBlock(text){
  if(/^```/m.test(text)) return text;
  const body = text.replace(/^(?:[ \t]*\n)+/, "").replace(/\s+$/, "");
  return "```\n" + body + "\n```";
}

function postMessage(asCode){
  if(!activeSession) return;
  let text = composerInput.value;
  if(!text.trim()) return;
  if(asCode === true) text = wrapAsCodeBlock(text);
  db.ref("sessions/" + activeSession + "/messages").push({
    text: text,
    ts: firebase.database.ServerValue.TIMESTAMP,
    shared: true
  }).then(function(){ composerInput.value = ""; composerInput.focus(); })
    .catch(function(err){ alert("Post failed: " + (err && err.message)); });
}
document.getElementById("postBtn").addEventListener("click", function(){ postMessage(false); });
document.getElementById("postCodeBtn").addEventListener("click", function(){ postMessage(true); });

/* ============================================================
   Code shortcuts (composer + edit modal)
   Mod+E (Cmd on Mac, Ctrl elsewhere): GitHub-style —
     nothing selected      -> insert an empty ``` block, cursor inside
     multi-line selection  -> wrap it in a ``` block
     part of one line      -> wrap it in `inline code`
   Mod+Shift+Enter (composer): post the whole message as a code block.
   Edits go through execCommand("insertText") so native undo (Mod+Z) works.
   ============================================================ */
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? "⌘" : "Ctrl+";
// On Mac only Cmd counts (Ctrl+E is the native "end of line" there).
function isModKey(e){ return IS_MAC ? (e.metaKey && !e.ctrlKey) : (e.ctrlKey && !e.metaKey); }
function isCodeShortcut(e){ return isModKey(e) && !e.shiftKey && !e.altKey && (e.key === "e" || e.key === "E" || e.code === "KeyE"); }

function insertIntoTextarea(ta, start, end, str, selStart, selEnd){
  ta.focus();
  ta.setSelectionRange(start, end);
  let ok = false;
  try { ok = document.execCommand("insertText", false, str); } catch(err){}
  if(!ok) ta.setRangeText(str, start, end, "end"); // fallback (no undo entry)
  ta.setSelectionRange(start + selStart, start + selEnd);
}

function toggleCodeInTextarea(ta){
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const sel = v.slice(s, e);
  const atLineStart = s === 0 || v[s - 1] === "\n";
  const atLineEnd = e === v.length || v[e] === "\n";
  const pre = atLineStart ? "" : "\n";
  const post = atLineEnd ? "" : "\n";
  if(sel === ""){
    const str = pre + "```\n\n```" + post;
    const caret = pre.length + 4;                   // the empty middle line
    insertIntoTextarea(ta, s, e, str, caret, caret);
  } else if(sel.indexOf("\n") >= 0){
    const body = sel.replace(/\n+$/, "");
    const str = pre + "```\n" + body + "\n```" + post;
    const end = str.length - post.length;           // caret after closing fence
    insertIntoTextarea(ta, s, e, str, end, end);
  } else {
    const str = "`" + sel + "`";
    insertIntoTextarea(ta, s, e, str, 1, 1 + sel.length); // keep the text selected
  }
}

composerInput.addEventListener("keydown", function(e){
  if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); postMessage(e.shiftKey); }
  else if(isCodeShortcut(e)){ e.preventDefault(); toggleCodeInTextarea(composerInput); }
});
document.getElementById("composerHint").textContent =
  MOD + "Enter post · " + MOD + "⇧Enter post as code · " + MOD + "E code block";
document.getElementById("postCodeBtn").title = "Post the whole message as a code block (" + MOD + "⇧Enter)";

/* ============================================================
   Page-width slider (shared behaviour with student page)
   The 0-100 value maps through a two-segment curve so the midpoint (50)
   is exactly the 760px default, low end ~420px, high end ~2400px.
   The choice is remembered in localStorage.
   ============================================================ */
const widthSlider = document.getElementById("widthSlider");
const WIDTH_MIN = 420, WIDTH_DEFAULT = 760, WIDTH_MAX = 2400, WIDTH_KEY = "cb_content_width";
function sliderValueToWidth(v){
  v = Number(v);
  if(v <= 50) return WIDTH_MIN + (v / 50) * (WIDTH_DEFAULT - WIDTH_MIN);
  return WIDTH_DEFAULT + ((v - 50) / 50) * (WIDTH_MAX - WIDTH_DEFAULT);
}
function applyContentWidth(v){
  document.documentElement.style.setProperty("--content-width", Math.round(sliderValueToWidth(v)) + "px");
}
(function initWidth(){
  let stored = null;
  try { stored = localStorage.getItem(WIDTH_KEY); } catch(e){}
  if(stored !== null) widthSlider.value = stored;
  applyContentWidth(widthSlider.value);
  widthSlider.addEventListener("input", function(){
    applyContentWidth(widthSlider.value);
    try { localStorage.setItem(WIDTH_KEY, widthSlider.value); } catch(e){}
  });
})();

/* ============================================================
   Draggable sidebar width (remembered in localStorage).
   ============================================================ */
const SIDEBAR_MIN = 180, SIDEBAR_MAX = 640, SIDEBAR_KEY = "cb_sidebar_w";
const sidebarResizer = document.getElementById("sidebarResizer");
(function initSidebar(){
  let stored = null;
  try { stored = localStorage.getItem(SIDEBAR_KEY); } catch(e){}
  if(stored !== null){
    const w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, parseInt(stored, 10) || 230));
    document.documentElement.style.setProperty("--sidebar-w", w + "px");
  }
  let dragging = false;
  function onMove(e){
    if(!dragging) return;
    const left = appView.getBoundingClientRect().left;
    let w = Math.round(e.clientX - left);
    w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, w));
    document.documentElement.style.setProperty("--sidebar-w", w + "px");
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    sidebarResizer.classList.remove("dragging");
    document.body.style.userSelect = "";
    document.body.style.cursor = "";
    const w = getComputedStyle(document.documentElement).getPropertyValue("--sidebar-w").trim();
    try { localStorage.setItem(SIDEBAR_KEY, parseInt(w, 10)); } catch(e){}
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
  }
  sidebarResizer.addEventListener("mousedown", function(e){
    e.preventDefault();
    dragging = true;
    sidebarResizer.classList.add("dragging");
    document.body.style.userSelect = "none";
    document.body.style.cursor = "col-resize";
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
})();

/* ============================================================
   Colour palette picker (orange / blue / green) — remembered in localStorage.
   ============================================================ */
(function initPalette(){
  const PALETTES = ["orange","blue","green"], PALETTE_KEY = "cb_palette";
  function apply(p){
    if(PALETTES.indexOf(p) < 0) p = "orange";
    document.documentElement.setAttribute("data-palette", p);
    const sw = document.querySelectorAll(".swatch");
    for(let i = 0; i < sw.length; i++) sw[i].classList.toggle("active", sw[i].getAttribute("data-palette") === p);
  }
  let stored = null;
  try { stored = localStorage.getItem(PALETTE_KEY); } catch(e){}
  apply(stored || "orange");
  const sw = document.querySelectorAll(".swatch");
  for(let i = 0; i < sw.length; i++){
    sw[i].addEventListener("click", function(){
      const p = this.getAttribute("data-palette");
      apply(p);
      try { localStorage.setItem(PALETTE_KEY, p); } catch(e){}
    });
  }
})();
</script>
